# Тестовый контур поверх docker-compose.yml.
# Сначала собрать linux-бинарники в integration-tests/out, затем:
# docker compose -f docker-compose.yml -f docker-compose.test.yml build provider-service route-service ai-service integration-tests
# docker compose -f docker-compose.yml -f docker-compose.test.yml up --no-build --abort-on-container-exit --exit-code-from integration-tests integration-tests
services:
  provider-service:
    build:
      context: .
      dockerfile: ./integration-tests/Dockerfile.services
      target: provider
    environment:
      PROVIDER_MODE: demo

  route-service:
    build:
      context: .
      dockerfile: ./integration-tests/Dockerfile.services
      target: route

  ai-service:
    build:
      context: .
      dockerfile: ./integration-tests/Dockerfile
      target: aimock

  integration-tests:
    build:
      context: .
      dockerfile: ./integration-tests/Dockerfile
    environment:
      PROVIDER_GRPC_ADDR: provider-service:50058
      ROUTE_GRPC_ADDR: route-service:50057
    depends_on:
      - provider-service
      - route-service
      - ai-service
