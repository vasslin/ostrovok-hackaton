name: Verify stage 2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Unit and gRPC integrations, race detector, coverage, vet
        run: go run ./cmd/dev test -race -cover
      - name: End to end with separate service processes
        run: go run ./cmd/dev e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: reports/
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - run: docker compose up --build --wait --wait-timeout 180
      - run: go run ./cmd/dev smoke
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
