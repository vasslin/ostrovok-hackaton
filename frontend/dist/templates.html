<template id="render-app-shell">

    <div class="rail-links">
      {{plannerButton}}{{historyButton}}{{profileButton}}
    </div>
    <div class="rail-bottom">
      <span class="rail-word">ПОРА<br>В ПУТЬ</span>{{profileButton2}}
    </div>
  </aside>
  <div class="app-main">
    <header class="header">
      <a class="wordmark" href="#planner">О!дин запрос<span>Путешествие, которое складывается</span></a>
      <div class="header-right">
        <span class="demo-tag"><span></span>{{conditional}}</span>{{profileButton3}}
      </div>
    </header>
    {{conditional2}}
    <footer class="footer">
      <span>Одна идея - целое путешествие.</span><span>{{conditional3}}</span>

      {{plannerButton2}}{{historyButton2}}{{profileButton4}}

  </div>
</div>
{{renderedDrawer}}{{renderedModal}}
</template>

<h3>

</h3>
<p class="muted">

<template id="render-modal-eyebrow">
<span class="eyebrow">ПОДСТРОИМ ПОД ВАС</span>
<h2 id="modal-title">
  Параметры поездки
</h2>
<p class="muted">
  Изменения обновят маршрут, билеты и стоимость.
</p>
<form id="criteria-form">
  <div class="form-grid">
    <label>Откуда<select name="origin">{{value}}</select></label><label>Куда<select name="destination">{{value2}}</select></label><label>Дата отправления<input type="date" name="startDate" value="{{cStartDate}}" required></label><label>Ночей<input type="number" name="nights" min="2" max="21" value="{{cNights}}" required></label><label>Взрослых<input type="number" name="adults" min="1" max="6" value="{{cAdults}}" required></label><label>Возраст детей через запятую<input name="childrenAges" value="{{cChildrenAges}}" placeholder="Например: 4, 7" maxlength="30"></label>
  </div>
  <label>Бюджет на всех, ₽<input type="number" name="budget" min="1000" max="10000000" value="{{round}}" required></label><label class="checkbox-label"><input type="checkbox" name="pets" {{conditional}}> С нами питомец</label><button class="primary full" type="submit" {{conditional2}}>Обновить поездку {{arrowIcon}}</button>
</form>
</template>

</p>
<form id="login-form">

  <label>Пароль<input type="password" name="password" required minlength="12" autocomplete="current-password"></label>
  <p id="login-error" role="alert">{{loginError}}</p>
  <button class="primary full" type="submit" {{disabled}}>{{submitLabel}}</button>
  <button class="text-button" type="button" data-action="auth-mode" {{disabled}}>{{switchLabel}}</button>
</form>
</template>

      <div class="assistant-avatar">
        {{sparkIcon}}
      </div>
      <div>
        <h2>
          Ваш попутчик
        </h2>
        <p>
          {{conditional2}}
        </p>
      </div>
      <span class="online-dot"></span>
    </div>

  </div>

<template id="ticket-offer-ticket-offer">
<button class="ticket-offer {{conditional}}" data-action="select-ticket" data-item="{{sId}}" data-offer="{{oId}}" {{conditional2}} aria-pressed="{{selected}}"><span class="airline-symbol">{{planeIcon}}</span><span class="ticket-carrier"><strong>{{oCarrier}}</strong><small>{{oNumber}} · {{conditional3}}</small></span><span class="flight-times"><strong>{{localTime}} <span>-</span> {{localTime2}}</strong><small>{{duration}} · без пересадок</small></span><span class="offer-price"><strong>{{price}}</strong><small>на всех гостей</small></span><span class="selection-circle">{{conditional4}}</span></button>
</template>

<template id="render-review">
<section class="config-review" aria-label="Параметры поездки">
  <p class="notice" role="status">{{capabilities}}</p>
  <form id="review-form" class="review-grid">
    <label>Откуда<input name="origin" value="{{origin}}" required maxlength="100"></label>
    <label>Страна отправления (код, например RU)<input name="originCountry" value="{{originCountry}}" pattern="[A-Za-z]{2}" maxlength="2"></label>
    <label>Куда<input name="destination" value="{{destination}}" required maxlength="100"></label>
    <label>Страна назначения (код, например FR)<input name="destinationCountry" value="{{destinationCountry}}" pattern="[A-Za-z]{2}" maxlength="2"></label>
    <label>Дата отправления<input type="date" name="departure" value="{{departure}}" required></label>
    <label>Дата возвращения<input type="date" name="return" value="{{returnDate}}"></label>
    <label>Взрослые<input type="number" name="adults" min="1" max="9" value="{{adults}}" required></label>
    <label>Возраст детей через запятую<input name="children" value="{{children}}" placeholder="Например, 7, 12"></label>
    <label>Гражданство гостей (код, например ru)<input name="residency" value="{{residency}}" pattern="[A-Za-z]{2}" maxlength="2"></label>
    <label>Бюджет на всех гостей<input type="number" name="budget" min="1" step="1" value="{{budget}}" placeholder="Не задан"></label>
    <label>Валюта<select name="currency">{{currencies}}</select></label>
    <label class="review-check"><input type="checkbox" name="hotel" {{hotel}}>Нужен отель</label>
    <label class="review-check"><input type="checkbox" name="roundTrip" {{roundTrip}}>Туда и обратно</label>
    <fieldset class="review-wide"><legend>Транспорт</legend>{{modes}}</fieldset>
    <p class="review-wide">{{extra}}</p>
    <p class="review-wide" role="alert">{{warning}}</p>
    <div class="review-wide review-actions">
      <button type="submit" name="intent" value="save" class="button button-light" {{disabled}}>Сохранить изменения</button>
      <button type="submit" name="intent" value="search" class="button primary" {{searchDisabled}}>Подтвердить и искать</button>
      {{transportOnly}}
    </div>
  </form>
</section>
</template>
