services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      HTTP_PORT: "8080"
      TRAVEL_GRPC_ADDR: travel-service:50051
      SESSION_GRPC_ADDR: session-service:50052
      USER_GRPC_ADDR: user-service:50053
      ORDER_GRPC_ADDR: order-service:50054
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    depends_on:
      travel-service:
        condition: service_healthy
      session-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  travel-service:
    build:
      context: .
      dockerfile: travel-service/Dockerfile
    environment:
      GRPC_PORT: "50051"
      SESSION_GRPC_ADDR: session-service:50052
      AI_GRPC_ADDR: ai-service:50055
      MAP_GRPC_ADDR: map-service:50056
      ROUTE_GRPC_ADDR: route-service:50057
    depends_on:
      session-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      map-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  session-service:
    build:
      context: .
      dockerfile: session-service/Dockerfile
    environment:
      GRPC_PORT: "50052"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50052"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      GRPC_PORT: "50053"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50053"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      GRPC_PORT: "50054"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50054"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      GRPC_PORT: "50055"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50055"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  map-service:
    build:
      context: .
      dockerfile: map-service/Dockerfile
    environment:
      GRPC_PORT: "50056"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50056"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  route-service:
    build:
      context: .
      dockerfile: route-service/Dockerfile
    environment:
      GRPC_PORT: "50057"
      PROVIDER_GRPC_ADDR: provider-service:50058
    depends_on:
      provider-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50057"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  provider-service:
    build:
      context: .
      dockerfile: provider-service/Dockerfile
    environment:
      GRPC_PORT: "50058"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50058"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
