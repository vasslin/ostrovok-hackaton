FROM golang:1.27.1-alpine
RUN apk add --no-cache protobuf
RUN go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
RUN go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
RUN apk add --no-cache protobuf-dev
WORKDIR /src
ENTRYPOINT ["sh", "-c", "protoc -I. -I/usr/include --go_out=. --go_opt=Mapi/provider/v1/parts.proto=ai-service/api/provider/v1 --go_opt=paths=source_relative --go_opt=Mapi/common/v1/trip.proto=ai-service/api/common/v1 --go_opt=Mapi/ai/v1/ai.proto=ai-service/api/ai/v1 --go-grpc_out=. --go-grpc_opt=Mapi/provider/v1/parts.proto=ai-service/api/provider/v1 --go-grpc_opt=paths=source_relative --go-grpc_opt=Mapi/common/v1/trip.proto=ai-service/api/common/v1 --go-grpc_opt=Mapi/ai/v1/ai.proto=ai-service/api/ai/v1 api/provider/v1/parts.proto api/travel/v1/travel.proto api/common/v1/trip.proto api/ai/v1/ai.proto && sed -i 's@[[:space:]]*//.*$@@' api/provider/v1/*.pb.go api/travel/v1/*.pb.go api/common/v1/*.pb.go api/ai/v1/*.pb.go && gofmt -w api/provider/v1/*.pb.go api/travel/v1/*.pb.go api/common/v1/*.pb.go api/ai/v1/*.pb.go"]
