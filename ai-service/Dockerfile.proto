FROM golang:1.27.1-alpine
RUN apk add --no-cache protobuf
RUN go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
RUN go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
RUN apk add --no-cache protobuf-dev
WORKDIR /src
ENTRYPOINT ["sh", "-c", "protoc -I. -I/usr/include --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative api/travel/v1/travel.proto && sed -i 's@[[:space:]]*//.*$@@' api/travel/v1/*.pb.go && gofmt -w api/travel/v1/*.pb.go"]
